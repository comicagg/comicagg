name: Tests

on:
  # push:
  #   branches: ["development"]
  #   tags: ["2*"]
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_IMAGE_NAME: comicagg/python
  APP_IMAGE_NAME: comicagg/app
  PROXY_IMAGE_NAME: comicagg/proxy
  PYTHON_VERSION: "3.14"

  NGINX_BUILD_DIR: /tmp/nginx/

  DJANGO_DEBUG: 0
  DJANGO_STATIC_ROOT: /tmp/nginx/static/
  DJANGO_SECRET_KEY: this-is-just-for-building
  DJANGO_DATABASE: sqlite3://comicagg:comicagg@db:5432/tmp/comicagg.db
  DJANGO_MEDIA_ROOT: /web/media/
  DJANGO_MEDIA_URL: /.media/
  DJANGO_STATIC_URL: /.static/
  DJANGO_ADMINS: Admin <admin@comicagg.com>
  DJANGO_MANAGERS: Admin <admin@comicagg.com>
  DJANGO_EMAIL_HOST: //comicagg:comicagg@smtp
  DJANGO_DEFAULT_FROM_EMAIL: robot@comicagg.com
  DJANGO_SERVER_EMAIL: robot@comicagg.com
  DJANGO_LOGS_DIR: /tmp/log/comicagg
  CELERY_BROKER_URL: redis://redis:6379

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run JavaScript behavior tests
        run: npm run test:js
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-test-results
          path: test-results/
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comicagg
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: comicagg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comicagg -d comicagg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check out source
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        name: Set up Python ${{ env.PYTHON_VERSION }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.12
      - name: Install Dependencies
        run: uv sync --locked --no-install-project --no-default-groups --group dev
      - name: Run Tests
        run: |
          uv run --no-sync python -Wa manage.py test --noinput --failfast comics comicagg
      - name: Run PostgreSQL tests including concurrency
        run: uv run --no-sync python -Wa manage.py test --noinput --failfast comics comicagg
        env:
          DJANGO_DATABASE: postgresql://comicagg:local-test-only@127.0.0.1:5432/comicagg
      - name: Load fixtures
        run: |
          uv run --no-sync python manage.py migrate
          uv run --no-sync python manage.py loaddata comics.Comic.json
        env:
          DJANGO_DATABASE: sqlite3://comicagg:comicagg@db:5432/${{ runner.temp }}/comicagg.db
