name: CI

on:
  push:
    branches:
      - development
    tags:
      - 2*
  pull_request:
    branches:
      - development
    types:
      - assigned
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to repository'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  push_image: ${{ inputs.push_image || github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/2') }}
  APP_IMAGE_NAME: comicagg/app
  PROXY_IMAGE_NAME: comicagg/proxy
  PYTHON_VERSION: "3.14"
jobs:
  build_app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout source ${{ github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        name: Set up Docker Buildx
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        name: Log into registry ${{ vars.REGISTRY }}
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: image-metadata
        name: Extract metadata for APP image
        with:
          images: ${{ vars.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=match,pattern=\d{6}\.\d+
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-and-push-app
        name: Build and push APP
        with:
          context: .
          push: ${{ env.push_image == 'true' }}
          tags: ${{ steps.image-metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build_proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    env:
      NGINX_BUILD_DIR: /tmp/nginx/
      DJANGO_STATIC_ROOT: /tmp/nginx/static/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout source ${{ github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        name: Set up uv and Python ${{ env.PYTHON_VERSION }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Py Dependencies, collect static files and prepare PROXY image
        env:
          DJANGO_DEBUG: 1
          DJANGO_SECRET_KEY: this-is-just-for-building
          DJANGO_DATABASE: sqlite3://comicagg:comicagg@db:5432/tmp/comicagg.db
          DJANGO_MEDIA_ROOT: /web/media/
          DJANGO_MEDIA_URL: /.media/
          DJANGO_STATIC_URL: /.static/
          DJANGO_ADMINS: Admin <admin@comicagg.com>
          DJANGO_MANAGERS: Admin <admin@comicagg.com>
          DJANGO_EMAIL_HOST: //comicagg:comicagg@smtp
          DJANGO_DEFAULT_FROM_EMAIL: robot@comicagg.com
          DJANGO_SERVER_EMAIL: robot@comicagg.com
          DJANGO_LOGS_DIR: /tmp/log/comicagg
          DJANGO_SITE_DOMAIN: https://build.comicagg.com
          CELERY_BROKER_URL: redis://redis:6379
        run: |
          uv sync --locked --no-install-project --no-default-groups
          mkdir -p $DJANGO_STATIC_ROOT
          uv run --no-sync python manage.py collectstatic --noinput
          cp ../deployment/nginx/* ${{ env.NGINX_BUILD_DIR }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        name: Set up Docker Buildx
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        name: Log into registry ${{ vars.REGISTRY }}
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: proxy-metadata
        name: Extract metadata for PROXY image
        with:
          images: ${{ vars.REGISTRY }}/${{ env.PROXY_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=match,pattern=\d{6}\.\d+
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-and-push-nginx
        name: Build and push PROXY image
        with:
          context: ${{ env.NGINX_BUILD_DIR }}
          push: ${{ env.push_image == 'true' }}
          tags: ${{ steps.proxy-metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
