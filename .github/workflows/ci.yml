name: CI

on:
  push:
    branches: ["development"]
    tags: ["2*"]
#   pull_request:
#     branches: [ "development" ]
  workflow_dispatch:

env:
  REGISTRY: nublar.azurecr.io
  PYTHON_IMAGE_NAME: comicagg/python
  APP_IMAGE_NAME: comicagg/app
  PROXY_IMAGE_NAME: comicagg/proxy
  PYTHON_VERSION: 3.12

  NGINX_BUILD_DIR: /tmp/nginx/

  DJANGO_DEBUG: 1
  DJANGO_STATIC_ROOT: /tmp/nginx/static/
  DJANGO_SECRET_KEY: this-is-just-for-building
  DJANGO_DATABASE: sqlite3://comicagg:comicagg@db:5432/tmp/comicagg.db
  DJANGO_MEDIA_ROOT: /web/media/
  DJANGO_MEDIA_URL: /.media/
  DJANGO_STATIC_URL: /.static/
  DJANGO_ADMINS: Admin <admin@comicagg.com>
  DJANGO_MANAGERS: Admin <admin@comicagg.com>
  DJANGO_EMAIL_HOST: //comicagg:comicagg@smtp
  DJANGO_DEFAULT_FROM_EMAIL: robot@comicagg.com
  DJANGO_SERVER_EMAIL: robot@comicagg.com
  DJANGO_LOGS_DIR: /tmp/log/comicagg
  DJANGO_SITE_DOMAIN: https://build.comicagg.com
  CELERY_BROKER_URL: redis://redis:6379

jobs:
  check-changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    outputs:
      requirements: ${{ steps.requirements.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: requirements
        with:
          filters: |
            changed:
              - 'src/requirements.txt'

  build-python:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.requirements == 'true'
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - uses: docker/login-action@v3
        name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: py-metadata
        name: Extract metadata for Python image
        with:
          images: ${{ env.REGISTRY }}/${{ env.PYTHON_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=match,pattern=\d{6}\.\d+
      - uses: docker/build-push-action@v5
        id: build-and-push-python
        name: Build and push Python
        with:
          context: .
          file: python.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.py-metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PY_VERSION=${{ env.PYTHON_VERSION }}

  build-app:
    runs-on: ubuntu-latest
    needs:
      - build-python
      - check-changes
    if: ${{ always() }}
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - uses: docker/login-action@v3
        name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: app-metadata
        name: Extract metadata for APP image
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=match,pattern=\d{6}\.\d+
      - name: Use Python image from this run
        if: needs.check-changes.outputs.requirements == 'true'
        run: |
          echo "TAG=${{ env.DOCKER_METADATA_OUTPUT_VERSION }}" >> $GITHUB_ENV
      - name: Use latest built Python image
        if: needs.check-changes.outputs.requirements == 'false'
        run: |
          echo "TAG=latest" >> $GITHUB_ENV
      - uses: docker/build-push-action@v5
        id: build-and-push-app
        name: Build and push APP
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app-metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TAG=${{ env.TAG }}

  build-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Set up Python ${{ env.PYTHON_VERSION }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Py Dependencies, collect static files and prepare PROXY image
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p $DJANGO_STATIC_ROOT
          python manage.py collectstatic --noinput
          cp ../deployment/nginx/* ${{ env.NGINX_BUILD_DIR }}
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - uses: docker/login-action@v3
        name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: proxy-metadata
        name: Extract metadata for PROXY image
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=match,pattern=\d{6}\.\d+
      - uses: docker/build-push-action@v5
        id: build-and-push-nginx
        name: Build and push PROXY image
        with:
          context: ${{ env.NGINX_BUILD_DIR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.proxy-metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
