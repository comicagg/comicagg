[project]
name = "comicagg"
version = "5.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.*",
    "requests==2.34.2",
    "gunicorn==27.0.1",
    "django-htmx==1.29.0",
    "redis==8.1.0",
    "celery==5.7.0",
    "django-celery-beat==2.9.0",
    "django_celery_results==2.6.0",
    "flower==2.2.0",
    "django-mailer==2.3.2",
    "psycopg[binary]==3.3.9",
    "packaging"
]

[dependency-groups]
debug = [
    "django-debug-toolbar==8.0.0",
    "tblib==3.2.2",
    "django-debug-toolbar-template-profiler==2.1.0",
]
dev = [
    "pylint-django==2.8.0",
    "pre-commit==4.7.0",
    "ruff",
]
postgres = ["psycopg[c]==3.3.9"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 88
force-exclude = true
extend-exclude = ["lib/**", "**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E9", "F821", "F823", "I"]
