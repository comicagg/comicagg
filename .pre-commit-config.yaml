repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: Run Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Run Ruff formatter
        entry: uv run --locked ruff format
        language: system
        types: [python]
